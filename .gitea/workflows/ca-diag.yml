name: ca-diag
on:
  push:
    paths: ['.gitea/workflows/ca-diag.yml']
  workflow_dispatch:
jobs:
  diag:
    runs-on: dind
    container: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: what does this workflow-declared container actually see
        run: |
          echo "== bundle at /etc/ssl/certs/ca-certificates.crt =="
          ls -lL /etc/ssl/certs/ca-certificates.crt
          echo "cert_count=$(grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt)   (151 = my mount w/ Milton CA, ~150 = image's own)"
          echo "== CA-related env vars (from runner container.options?) =="
          env | grep -iE 'SSL_CERT_FILE|GIT_SSL_CAINFO|NODE_EXTRA_CA_CERTS' || echo "  (NONE set)"
          echo "== all mounts visible =="
          mount | grep -iE 'ssl|cert' || echo "  (no cert bind-mounts)"
          echo "== does TLS to Gitea work? =="
          apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq curl >/dev/null 2>&1
          curl -sS -o /dev/null -w "  curl->Gitea: HTTP %{http_code}\n" https://git.karlinsey.ddns.net/api/v1/version || echo "  curl TLS FAILED (Milton CA not trusted here)"
