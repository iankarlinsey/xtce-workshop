name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-build-and-test:
    runs-on: dind
    container: mcr.microsoft.com/dotnet/sdk:10.0@sha256:e1ffd2a92ae84c1291bc1b6887501f8af98e6331e7af6d4c8d37168c5e87a64c
    steps:
      - name: Install git and Node.js
        # actions/checkout and actions/upload-artifact are JS actions that need a `node`
        # binary in the job container to run their dist/index.js — mcr.microsoft.com/dotnet/sdk
        # doesn't ship one, and this container's contents aren't otherwise established.
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # Coverage collection rides the test run via the coverlet.collector
        # package every test project already references. XTCE_COVERAGE_RUN tells
        # wall-clock performance guards to skip their timing assertion — instrumentation
        # roughly doubles hot-loop cost, so timing bounds are meaningless here.
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults
        env:
          XTCE_COVERAGE_RUN: '1'

      - name: Coverage report and gate
        # Merges the per-project Cobertura files, prints the summary into the job log,
        # renders the browsable HTML report, and FAILS the job when line coverage drops
        # below the floor. Floors are ratchets pinned just under the measured baseline
        # (backend: 88.8% line / 84.6% branch on 2026-08-20) — raise them deliberately,
        # never lower them to make a red build green.
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report "-reporttypes:TextSummary;Html"
          cat coverage-report/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9]+(?=\.?[0-9]*%)' coverage-report/Summary.txt | head -1)
          BRANCH=$(grep -oP 'Branch coverage: \K[0-9]+(?=\.?[0-9]*%)' coverage-report/Summary.txt | head -1)
          echo "line=$LINE% (floor 85%), branch=$BRANCH% (floor 80%)"
          [ "$LINE" -ge 85 ] || { echo "::error::line coverage $LINE% is below the 85% floor"; exit 1; }
          [ "$BRANCH" -ge 80 ] || { echo "::error::branch coverage $BRANCH% is below the 80% floor"; exit 1; }

      - name: Publish test results
        if: always()
        # v4+ requires GitHub's newer Actions Results API backend, unsupported on
        # Gitea/GHES-style servers ("not currently supported on GHES"). v3 uses the
        # older upload API that Gitea Actions does support.
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: '**/test-results.trx'

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage-report
          path: coverage-report/

  frontend-build-and-test:
    runs-on: dind
    # Pinned by digest to match web/Dockerfile — re-pin both together when bumping Node.
    container: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    steps:
      - name: Install git and Chromium
        # Runs before checkout, at the job's workspace root — web/ doesn't exist yet,
        # so this can't use working-directory: web (a job-level default would apply here
        # too and fail with "no such file or directory" before checkout ever creates it).
        run: apt-get update && apt-get install -y --no-install-recommends git chromium

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npx ng build --configuration production

      - name: Test
        working-directory: web
        # --code-coverage activates the karma-coverage reporter configured in
        # karma.conf.js, whose check thresholds fail this step when global
        # coverage drops below the floors pinned under the 2026-08-20 baseline
        # (83.2% lines / 66.9% branches).
        run: npx ng test --watch=false --code-coverage
        env:
          CHROME_BIN: /usr/bin/chromium

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage-report
          path: web/coverage/
