server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's embedded DNS. Resolving via a variable (not a literal
    # hostname in proxy_pass) defers resolution to request time — if this image is run
    # standalone, outside docker-compose, "api" won't resolve, but nginx still starts
    # cleanly and only /api requests fail (502), not the whole container. A literal
    # proxy_pass hostname would make nginx refuse to start at all when unresolvable.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream "http://api:8080";

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Angular router uses client-side routes; fall back to index.html for any
    # path that isn't a real static file so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
