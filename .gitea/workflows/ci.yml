name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-build-and-test:
    runs-on: dind
    container: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: Install git and Node.js
        # actions/checkout and actions/upload-artifact are JS actions that need a `node`
        # binary in the job container to run their dist/index.js — mcr.microsoft.com/dotnet/sdk
        # doesn't ship one, and this container's contents aren't otherwise established.
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        # v4+ requires GitHub's newer Actions Results API backend, unsupported on
        # Gitea/GHES-style servers ("not currently supported on GHES"). v3 uses the
        # older upload API that Gitea Actions does support.
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: '**/test-results.trx'

  frontend-build-and-test:
    runs-on: dind
    # Pinned by digest to match web/Dockerfile — re-pin both together when bumping Node.
    container: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    defaults:
      run:
        working-directory: web
    steps:
      - name: Install git and Chromium
        # Chromium is needed to run Karma tests headless — see web/karma.conf.js for why
        # a custom launcher (--no-sandbox) is required when running as root in a container.
        run: apt-get update && apt-get install -y --no-install-recommends git chromium

      - name: Checkout
        # defaults.run.working-directory only affects `run:` steps below, not this one —
        # checkout always unpacks at the job's workspace root regardless.
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Test
        run: npx ng test --watch=false
        env:
          CHROME_BIN: /usr/bin/chromium
