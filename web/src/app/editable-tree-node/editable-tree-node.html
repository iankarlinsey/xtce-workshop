@if (isVisible()) {
  <div class="tree-node-row" [class.selected]="isSelected()" (click)="onRowClick()">
    @if (node().children.length > 0) {
      <button type="button" class="toggle" (click)="toggle($event)" [attr.aria-expanded]="effectiveExpanded()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" [style.transform]="effectiveExpanded() ? 'rotate(0deg)' : 'rotate(-90deg)'"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    } @else {
      <span class="toggle-spacer"></span>
    }
    <svg class="node-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
    <span class="label">{{ node().name }}</span>
  </div>

  @if (effectiveExpanded() && node().children.length > 0) {
    <div class="tree-node-children">
      @for (child of node().children; track $index; let i = $index) {
        <app-editable-tree-node
          [node]="child"
          [path]="childPath(i)"
          [selectedPath]="selectedPath()"
          [searchTerm]="searchTerm()"
          (select)="onChildSelect($event)"
        />
      }
    </div>
  }
}
